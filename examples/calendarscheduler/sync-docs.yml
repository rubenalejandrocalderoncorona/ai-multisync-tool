name: Sync Documentation to Central Repo

# Ready for cAImanLabs/cAImanLabsCalendarScheduler. Save as .github/workflows/sync-docs.yml in that repo.

# ============================================================
# SOURCE REPO WORKFLOW — copy into each service repository.
#
# On a push, it dispatches to the central docs repo. All decisions (is this
# worth documenting? is the draft grounded?) are made centrally by the pipeline, so this
# workflow needs no AI key.
#
# Required secret: DOCS_SYNC_PAT  (contents + workflows on the CENTRAL repo)
# ============================================================

env:
  CENTRAL_REPO: 'cAImanLabs/cAImanLabs-Documentation'    # <- the production documentation repo
  TARGET_BRANCH: 'main'                             # <- branch in the central repo the docs PR targets ('main' = production branch; PRs only, never direct commits)
  SYNC_MODE: 'code'                                 # <- docs | code | both  (must match `mode` in the central config/repos.json)

on:
  push:
    branches: [main]            # <- branch(es) that should trigger a sync
    # No `paths:` filter: in code/both mode any source change can affect a page. The central pipeline's
    # zero-cost prefilter discards noise. For SYNC_MODE=docs the dispatch step below only fires on docs changes.
    paths-ignore:
      - '**.png'
      - '**.jpg'
      - '**.svg'
      - '**/package-lock.json'

# Only the latest commit on a branch needs to dispatch.
concurrency:
  group: sync-docs-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect changed documentation files
        id: files
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE"
          else
            RANGE="HEAD~1"
          fi
          FILES=$(git diff --name-only "$RANGE" HEAD -- docs documentation README.md \
            | grep -E '\.(md|mdx|txt)$' | grep -v '^\.github/' | tr '\n' ' ' || true)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "before=$RANGE" >> "$GITHUB_OUTPUT"
          echo "Changed docs: $FILES"

      - name: Dispatch to central docs repo
        if: steps.files.outputs.files != '' || env.SYNC_MODE != 'docs'
        env:
          DOCS_SYNC_PAT: ${{ secrets.DOCS_SYNC_PAT }}
          FILES: ${{ steps.files.outputs.files }}
          BEFORE: ${{ steps.files.outputs.before }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          [ -n "$DOCS_SYNC_PAT" ] || { echo "DOCS_SYNC_PAT is not set"; exit 1; }
          BEFORE_SHA=$(git rev-parse "$BEFORE")
          jq -n --arg repo "$REPO" --arg sha "$SHA" --arg before "$BEFORE_SHA" --arg ref "$REF" \
                --arg files "$FILES" --arg target "$TARGET_BRANCH" \
            '{event_type:"docs-updated", client_payload:{repository:$repo, sha:$sha, before:$before, ref:$ref, changed_files:$files, target_branch:$target}}' > payload.json
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DOCS_SYNC_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${CENTRAL_REPO}/dispatches" --data @payload.json)
          case "$CODE" in
            204) echo "dispatched to $CENTRAL_REPO" ;;
            401|403) echo "auth failed ($CODE): check DOCS_SYNC_PAT scopes"; exit 1 ;;
            404) echo "central repo not found or token lacks access"; exit 1 ;;
            *) echo "unexpected HTTP $CODE"; exit 1 ;;
          esac
