[project]
name = "ai-multisync-tool"
version = "0.3.0"
description = "Multi-repo documentation sync with an AI decision pipeline, vector retrieval and a fact store."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "langgraph>=0.2.60",
  "psycopg[binary]>=3.2",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.scripts]
multisync = "multisync.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["multisync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs real Qdrant and Postgres (QDRANT_URL, FACTSTORE_DATABASE_URL)"]
