name: Sync Documentation

# ============================================================
# CENTRAL WORKFLOW — lives on the default branch of the central docs repo
# (repository_dispatch is only delivered to workflows on the default branch).
#
# Pipeline: cheap zero-LLM checks -> similarity -> GAR/RAG draft -> LLM-as-judge loop.
#   published       trust=auto   committed straight to TARGET_BRANCH, indexed immediately
#   pending_review  trust=review opened as a PR for the technical writer; indexed only after merge
#   fallback        never published: ticket + Slack alert, draft kept as a workflow artifact
#
# Required secrets: DOCS_SYNC_PAT, AI_API_KEY, FACTSTORE_DATABASE_URL, CAIMANDESK_API_TOKEN (QDRANT_API_KEY only if your Qdrant has auth)
# Required variables: QDRANT_URL, CAIMANDESK_PROJECT_ID
# Tool pin: TOOL_REPO (default rubenalejandrocalderoncorona/ai-multysinc-tool), TOOL_REF (default main)
# Optional variables: RUNNER_LABEL (e.g. a self-hosted runner on the VPS that can reach
#   Postgres), AI_API_BASE_URL, AI_MODEL, AI_FAST_MODEL, AI_EMBED_MODEL, AI_EMBED_DIM,
#   TICKET_PROVIDER, GITHUB_HOST
# Optional secrets: SLACK_WEBHOOK_URL, JIRA_*
# ============================================================

on:
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repository (org/repo)'
        required: true
      source_ref:
        description: 'Source commit SHA or ref to sync from'
        required: true
      target_branch:
        description: 'Branch in this repo to write synced docs into'
        required: true
        default: 'staging'
      target_file:
        description: 'Single file to sync (blank = all docs in the repo)'
        required: false
        default: ''
      full:
        description: 'Code mode: regenerate every declared page from the whole repo, not just this commit'
        required: false
        type: boolean
        default: false

# One run per target branch at a time: queue, never cancel, so no dispatch is dropped.
concurrency:
  group: sync-docs-${{ github.event.client_payload.target_branch || github.event.inputs.target_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-docs:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      # Untrusted dispatch fields are only ever read through env, never interpolated into shell.
      SOURCE_REPO: ${{ github.event.client_payload.repository || github.event.inputs.source_repo }}
      SOURCE_SHA_IN: ${{ github.event.client_payload.sha || github.event.inputs.source_ref }}
      SOURCE_BEFORE: ${{ github.event.client_payload.before || '' }}
      TARGET_BRANCH: ${{ github.event.client_payload.target_branch || github.event.inputs.target_branch }}
      PAYLOAD_FILES: ${{ github.event.client_payload.changed_files || '' }}
      TARGET_FILE: ${{ github.event.inputs.target_file || '' }}
      GH_TOKEN: ${{ secrets.DOCS_SYNC_PAT }}

    steps:
      - name: Validate inputs
        run: |
          [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "invalid source repo"; exit 1; }
          [[ "$SOURCE_SHA_IN" =~ ^[A-Za-z0-9_./-]+$ ]]               || { echo "invalid source ref"; exit 1; }
          [[ "$TARGET_BRANCH" =~ ^[A-Za-z0-9_./-]+$ ]]               || { echo "invalid target branch"; exit 1; }
          # TARGET_BRANCH may be main/master (the PR base). The pipeline then forces trust=review, so nothing is ever committed there directly.

      - name: Checkout this docs repo (default branch, for config and the site)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DOCS_SYNC_PAT }}
          ref: ${{ github.event.repository.default_branch }}

      # The pipeline code lives in the tool repo and is pinned by ref; this repo only holds config + content.
      - name: Checkout ai-multisync-tool
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TOOL_REPO || 'rubenalejandrocalderoncorona/ai-multysinc-tool' }}
          ref: ${{ vars.TOOL_REF || 'main' }}
          token: ${{ secrets.DOCS_SYNC_PAT }}
          path: .multisync

      - name: Switch to target branch
        run: |
          if git fetch origin "$TARGET_BRANCH" 2>/dev/null; then
            git checkout "$TARGET_BRANCH"
          else
            git checkout -b "$TARGET_BRANCH"
          fi

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA_IN }}
          token: ${{ secrets.DOCS_SYNC_PAT }}
          path: source-repo
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pipeline dependencies
        working-directory: .multisync
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Resolve changed documentation files
        id: files
        working-directory: source-repo
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$TARGET_FILE" ]; then
            [ -f "$TARGET_FILE" ] || { echo "'$TARGET_FILE' not found"; exit 1; }
            LIST="$TARGET_FILE"
          elif [ -n "$PAYLOAD_FILES" ]; then
            LIST=$(echo "$PAYLOAD_FILES" | tr ' ' '\n')
          elif [ -n "$SOURCE_BEFORE" ] && git cat-file -e "$SOURCE_BEFORE" 2>/dev/null; then
            LIST=$(git diff --name-only "$SOURCE_BEFORE" "$SHA" -- docs documentation README.md)
          else
            LIST=$(git ls-files docs documentation README.md | grep -E '\.(md|mdx)$' || true)
          fi
          # Only markdown under docs/ or documentation/, never workflow files, no path traversal.
          LIST=$(echo "$LIST" | sed '/^$/d' | grep -E '^((docs|documentation)/.*\.(md|mdx|txt)|README\.md)$' | grep -v '\.\.' | sort -u || true)
          { echo "list<<EOF"; echo "$LIST"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "Changed docs:"; echo "$LIST"

      - name: Run decision pipeline
        env:
          CHANGED_FILES: ${{ steps.files.outputs.list }}
          SOURCE_SHA: ${{ steps.files.outputs.sha }}
          INTERNAL_AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL || 'https://api.openai.com' }}
          AI_API_PATH: ${{ vars.AI_API_PATH || '/v1/chat/completions' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4o' }}
          AI_FAST_MODEL: ${{ vars.AI_FAST_MODEL || 'gpt-4o-mini' }}
          AI_EMBED_MODEL: ${{ vars.AI_EMBED_MODEL || 'text-embedding-3-small' }}
          AI_EMBED_DIM: ${{ vars.AI_EMBED_DIM || '1536' }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ vars.QDRANT_COLLECTION || 'docs_chunks' }}
          QDRANT_CODE_COLLECTION: ${{ vars.QDRANT_CODE_COLLECTION || 'code_context' }}
          FACTSTORE_DATABASE_URL: ${{ secrets.FACTSTORE_DATABASE_URL }}
          TICKET_PROVIDER: ${{ vars.TICKET_PROVIDER || 'caimandesk' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          GITHUB_TOKEN: ${{ secrets.DOCS_SYNC_PAT }}
          GIT_HOST: ${{ vars.GIT_HOST || 'github.com' }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          FULL_SYNC: ${{ github.event.inputs.full == 'true' && '1' || '' }}
          DOC_STYLES: ${{ github.workspace }}/config/doc-styles.json
          PROMPTS_DIR: ${{ hashFiles('prompts/judge-docs.md') != '' && format('{0}/prompts', github.workspace) || '' }}
          # Config comes from THIS repo; tool defaults are the fallback.
          REPOS_CONFIG: ${{ github.workspace }}/config/repos.json
          FEATURE_REGISTRY: ${{ github.workspace }}/config/feature-registry.json
          INSTRUCTIONS_FILE: ${{ github.workspace }}/.multisync/.github/instructions/DocumentationInstructions.instructions.md
          TEMPLATES_PATH: ${{ github.workspace }}/.multisync/docs/templates
          CAIMANDESK_URL: ${{ vars.CAIMANDESK_URL || 'https://tickets.caimanlabs.com.mx' }}
          CAIMANDESK_API_TOKEN: ${{ secrets.CAIMANDESK_API_TOKEN }}
          CAIMANDESK_PROJECT_ID: ${{ vars.CAIMANDESK_PROJECT_ID }}
        run: node .multisync/scripts/run_pipeline.js

      - name: Commit published docs (auto-trust) to target branch
        run: |
          git config user.name "Documentation Bot"
          git config user.email "docs-bot@users.noreply.github.com"
          mapfile -t PUB < <(jq -r '.results[] | select(.outcome=="published" and .action!="none") | .targetPath' pipeline-results.json)
          if [ "${#PUB[@]}" -gt 0 ]; then
            git add -A -- "${PUB[@]}"
            git diff --staged --quiet || git commit -m "docs: auto-sync from ${SOURCE_REPO}" -m "Source commit: ${{ steps.files.outputs.sha }}"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Open review PR (review-trust)
        id: review
        run: |
          mapfile -t REV < <(jq -r '.results[] | select(.outcome=="pending_review" and .action!="none") | .targetPath' pipeline-results.json)
          [ "${#REV[@]}" -gt 0 ] || { echo "nothing needs review"; exit 0; }
          SHORT=$(echo "${{ steps.files.outputs.sha }}" | cut -c1-7)
          BR="docs-sync/$(echo "$SOURCE_REPO" | tr '/' '-')-$SHORT"
          git checkout -B "$BR"
          git add -A -- "${REV[@]}"
          git commit -m "docs: proposed sync from ${SOURCE_REPO}" -m "Source commit: ${{ steps.files.outputs.sha }}"
          git push -f origin "$BR"
          jq -r '"Source: `\(.repo)` @ `\(.commit[0:7])`\n\n| File | Precision | Recall | Style | Quality |\n|---|---|---|---|---|" , (.results[] | select(.outcome=="pending_review") | "| `\(.path)` | \(.metrics.final.precision) | \(.metrics.final.recall) | \(.metrics.final.style) | \(.metrics.final.quality) |")' pipeline-results.json > pr-body.md
          printf '\nMerging indexes this text into the vector store. Closing without merging leaves the index untouched.\n' >> pr-body.md
          if gh pr view "$BR" >/dev/null 2>&1; then
            gh pr edit "$BR" --body-file pr-body.md
          else
            gh pr create --base "$TARGET_BRANCH" --head "$BR" --title "docs: sync from ${SOURCE_REPO} (${SHORT})" --body-file pr-body.md
          fi
          gh pr view "$BR" --json url -q .url > pr-url.txt
          echo "pr_url=$(cat pr-url.txt)" >> "$GITHUB_OUTPUT"

      # The ticket tracks the PR while it waits for review. Approval = merging the PR; the ticket follows.
      - name: Open review ticket and link it from the PR
        if: steps.review.outputs.pr_url != ''
        env:
          PR_URL: ${{ steps.review.outputs.pr_url }}
          ENVIRONMENT: ${{ vars.REVIEW_ENVIRONMENT_NAME || 'QA' }}
          CAIMANDESK_URL: ${{ vars.CAIMANDESK_URL || 'https://tickets.caimanlabs.com.mx' }}
          CAIMANDESK_API_TOKEN: ${{ secrets.CAIMANDESK_API_TOKEN }}
          CAIMANDESK_PROJECT_ID: ${{ vars.CAIMANDESK_PROJECT_ID }}
          CAIMANDESK_TRANSPORT: ${{ vars.CAIMANDESK_TRANSPORT }}
          CAIMANDESK_MCP_URL: ${{ vars.CAIMANDESK_MCP_URL }}
        run: |
          OUT=$(node .multisync/scripts/review_ticket.js open || true)
          echo "$OUT"
          MARKER=$(echo "$OUT" | tail -1 | jq -r '.marker // empty')
          URL=$(echo "$OUT" | tail -1 | jq -r '.url // empty')
          if [ -n "$MARKER" ]; then
            BR=$(git rev-parse --abbrev-ref HEAD)
            gh pr view "$BR" --json body -q .body | grep -v 'multisync:ticket=' > pr-body-new.md || true
            printf '\nTicket: %s\n\n%s\n' "$URL" "$MARKER" >> pr-body-new.md
            gh pr edit "$BR" --body-file pr-body-new.md
          fi

      - name: Upload decision log and rejected drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results-${{ github.run_id }}
          path: |
            pipeline-results.json
            rejected/
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: node .multisync/scripts/generate-summary.js >> "$GITHUB_STEP_SUMMARY"
