apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: multirepo
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432, name: pg }]
          env:
            - { name: POSTGRES_DB, value: factstore }
            - { name: POSTGRES_USER, value: factstore }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: multisync-secrets, key: FACTSTORE_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe: { exec: { command: [pg_isready, -U, factstore, -d, factstore] }, periodSeconds: 10 }
          livenessProbe: { exec: { command: [pg_isready, -U, factstore, -d, factstore] }, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: multirepo
spec:
  selector: { app: postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
