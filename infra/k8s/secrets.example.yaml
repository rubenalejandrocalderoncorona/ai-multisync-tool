# Template only. Do NOT commit real values; create with:
#   kubectl -n multisync create secret generic multisync-secrets \
#     --from-literal=QDRANT_API_KEY=... --from-literal=FACTSTORE_PASSWORD=... \
#     --from-literal=FACTSTORE_DATABASE_URL=postgres://factstore:<pw>@postgres:5432/factstore
# or manage with sealed-secrets / external-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: multisync-secrets
  namespace: multisync
type: Opaque
stringData:
  QDRANT_API_KEY: "<set-me>"
  FACTSTORE_PASSWORD: "<set-me>"
  FACTSTORE_DATABASE_URL: "postgres://factstore:<set-me>@postgres:5432/factstore"
