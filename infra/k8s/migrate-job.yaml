# Creates the Qdrant collection and FactStore schema. Re-runnable (idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  name: multisync-migrate
  namespace: multisync
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: __PIPELINE_IMAGE__   # ghcr.io/<owner>/ai-multisync-pipeline:<tag>
          command: ["node", "scripts/healthcheck.js"]
          env:
            - { name: QDRANT_URL, value: "http://qdrant:6333" }
            - name: QDRANT_API_KEY
              valueFrom: { secretKeyRef: { name: multisync-secrets, key: QDRANT_API_KEY } }
            - name: FACTSTORE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: multisync-secrets, key: FACTSTORE_DATABASE_URL } }
