# Target: the existing `multirepo` namespace on the VPS (Qdrant and Postgres already run there).
#   kubectl kustomize infra/k8s            render
#   For a fresh cluster without the databases, apply infra/k8s/standalone first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multirepo
resources:
  - migrate-job.yaml
  - runner.yaml
# NOT listed on purpose: secrets.example.yaml, and rbac-personal.yaml (it targets the `personal` namespace and must be
# applied on its own: `kubectl apply -f infra/k8s/rbac-personal.yaml`).
